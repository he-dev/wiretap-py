version: 1
formatters:
  console_full:
    (): wiretap.util.logging.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      {asctime}.{msecs:03.0f} [{levelname:7s}]
      {indent}{activity[about]}: "{message}", ctx: {context}, fixme: {fixme}, trc={trace}, src={source}
  console_lite:
    (): wiretap.util.logging.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      {asctime}.{msecs:03.0f} [{levelname:7s}]
      {indent}{activity[about]}[{activity[event]}]: "{message}", ctx: {context}, fixme: {fixme}
  elastic_json:
    (): wiretap.util.logging.JsonFormatter
    encoders:
      - wiretap.util.encoding.EncodeDateTime
      - wiretap.util.encoding.EncodeUUID
      - wiretap.util.encoding.EncodeSet
      - wiretap.util.encoding.EncodePath
      - wiretap.util.encoding.EncodeToDict
    pipeline:
      - wiretap.util.buzz.AddTimestamp
      - wiretap.util.buzz.AddMessage
      - wiretap.util.buzz.AddActivity
      #- wiretap.util.buzz.AddContext
      - "()": wiretap.util.buzz.AddContext
        key: "properties"
      - wiretap.util.buzz.AddTrace
      - wiretap.util.buzz.AddSource
      - wiretap.util.buzz.AddException
      - wiretap.util.buzz.RemoveNoneOrEmpty
handlers:
  console_full:
    class: logging.StreamHandler
    formatter: console_full
    #level: INFO
  console_lite:
    class: logging.StreamHandler
    formatter: console_lite
    #level: INFO
  console_file:
    class: "logging.handlers.TimedRotatingFileHandler"
    when: "d"
    interval: 1
    filename: "c:\\temp\\wiretap_console.log"
    formatter: console_full
    #level: TRACE
  elastic_file:
    class: "logging.FileHandler"
    filename: "c:\\temp\\wiretap_elastic.log"
    formatter: elastic_json
    #level: DEBUG
loggers:
  root:
    #handlers: [ "console", "file", "elastic_file" ]
    #handlers: [ "console_full", "console_file", "elastic_file" ]
    handlers: [ "console_lite", "console_file", "elastic_file" ]
    #handlers: [ "elastic_file" ]
    #handlers: [ "console" ]
    #level: "INFO"
    level: "DEBUG"
    #level: "TRACE"
  PIL:
    level: "WARNING"