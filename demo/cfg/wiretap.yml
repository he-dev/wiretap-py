version: 1
formatters:
  classic:
    style: "{"
    format: "{asctime}.{msecs:03d} | {module}.{funcName} | {message}"
    datefmt: "%Y-%m-%d %H:%M:%S"
    defaults:
      status: "<status>"
      correlation: "<correlation>"
      extra: "<extra>"
  wiretap:
    (): wiretap.util.logging.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      [{asctime}.{msecs:03.0f} {levelname:7s}]
      {scope}: "{message}"
      properties={properties}
      activity={activity}
      source={source}
  elastic:
    (): wiretap.util.logging.JsonFormatter
    encoders:
      - wiretap.util.logging.ChainPathEncoder
      - wiretap.util.logging.DateTimeEncoder
      - wiretap.util.logging.UUIDEncoder
      - wiretap.util.logging.SetEncoder
      - wiretap.util.logging.PathEncoder
      - wiretap.util.logging.LoopStatsEncoder
    properties:
      - wiretap.util.logging.AddTimestamp
      - wiretap.util.logging.AddMessage
      - wiretap.util.logging.AddProperties
      - wiretap.util.logging.AddActivity
      - wiretap.util.logging.AddSource
      - wiretap.util.logging.AddException
      - (): wiretap.util.logging.AddEnvironmentVariables
        names:
          - app_id
handlers:
  console:
    class: logging.StreamHandler
    formatter: wiretap
    #level: INFO
  file:
    class: "logging.handlers.TimedRotatingFileHandler"
    when: "d"
    interval: 1
    filename: "c:\\temp\\wiretap.log"
    formatter: wiretap
    #level: TRACE
  elastic_file:
    class: "logging.FileHandler"
    filename: "c:\\temp\\elastic.log"
    formatter: elastic
    #level: DEBUG
  #sqlserver:
  #  class: "wiretap_sqlserver.SqlServerHandler"
  #  #connection_string: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=automation;UID=sa;PWD=;"
  #  insert: null
  #  level: "DEBUG"
  #  formatter: "auto"

loggers:
  root:
    #handlers: [ "console", "file", "elastic_file" ]
    handlers: [ "console", "elastic_file" ]
    # handlers: [ "console" ]
    level: "TRACE"
    #level: "INFO"
  PIL:
    level: "WARNING"