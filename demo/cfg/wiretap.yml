version: 1
formatters:
  console_full:
    (): wiretap.util.logging.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      {asctime}.{msecs:03.0f} [{levelname:7s}]
      {indent}{message}; tags: {activity[tags]}; state: {state}; span: {span}; source={source}
  console_lite:
    (): wiretap.util.logging.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      {asctime}.{msecs:03.0f} [{levelname:7s}]
      {indent}{operation}: "{message}", tags: {activity[tags]}
  elastic_json:
    (): wiretap.util.logging.JSONFormatter
    encoders:
      - wiretap.util.services.EncodeDateTime
      - wiretap.util.services.EncodeUUID
      - wiretap.util.services.EncodeSet
      - wiretap.util.services.EncodePath
      - wiretap.util.services.EncodeToDict
    properties:
      - wiretap.util.services.AddTimestamp
      - wiretap.util.services.AddMessage
      - wiretap.util.services.AddActivity
      - wiretap.util.services.AddSpan
      - wiretap.util.services.AddSource
      - wiretap.util.services.AddException
#      - (): wiretap.util.logging.AddEnvironmentVariables
#        names:
#          - app_id
handlers:
  console_full:
    class: logging.StreamHandler
    formatter: console_full
    #level: INFO
  console_lite:
    class: logging.StreamHandler
    formatter: console_lite
    #level: INFO
  console_file:
    class: "logging.handlers.TimedRotatingFileHandler"
    when: "d"
    interval: 1
    filename: "c:\\temp\\wiretap_console.log"
    formatter: console_full
    #level: TRACE
  elastic_file:
    class: "logging.FileHandler"
    filename: "c:\\temp\\wiretap_elastic.log"
    formatter: elastic_json
    #level: DEBUG
loggers:
  root:
    #handlers: [ "console", "file", "elastic_file" ]
    handlers: [ "console_full", "console_file", "elastic_file" ]
    # handlers: [ "console_lite", "console_file", "elastic_file" ]
    # handlers: [ "console_lite", "elastic_file" ]
    # handlers: [ "console" ]
    level: "INFO"
    #level: "DEBUG"
    #level: "TRACE"
  wiretap:
    #level: "INFO"
    level: "DEBUG"
  PIL:
    level: "WARNING"