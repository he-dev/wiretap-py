version: 1
formatters:
  console_full:
    (): wiretap.util.logging.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      {asctime}.{msecs:03.0f} [{levelname:7s}]
      {indent}{activity[about]}: "{message}", context: {context}, trace={trace}, source={source}
  console_lite:
    (): wiretap.util.logging.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      {asctime}.{msecs:03.0f} [{levelname:7s}]
      {indent}{activity[about]}[{activity[event]}]: "{message}", context: {context}
  elastic_json:
    (): wiretap.util.logging.JsonFormatter
    encoders:
      - wiretap.util.buzz.EncodeDateTime
      - wiretap.util.buzz.EncodeUUID
      - wiretap.util.buzz.EncodeSet
      - wiretap.util.buzz.EncodePath
      - wiretap.util.buzz.EncodeToDict
    properties:
      - wiretap.util.buzz.AddTimestamp
      - wiretap.util.buzz.AddMessage
      - wiretap.util.buzz.AddActivity
      #- wiretap.util.buzz.AddProperties
      #- wiretap.util.buzz.AddSpan
      - wiretap.util.buzz.AddSource
      - wiretap.util.buzz.AddException
#      - (): wiretap.util.logging.AddEnvironmentVariables
#        names:
#          - app_id
handlers:
  console_full:
    class: logging.StreamHandler
    formatter: console_full
    #level: INFO
  console_lite:
    class: logging.StreamHandler
    formatter: console_lite
    #level: INFO
  console_file:
    class: "logging.handlers.TimedRotatingFileHandler"
    when: "d"
    interval: 1
    filename: "c:\\temp\\wiretap_console.log"
    formatter: console_full
    #level: TRACE
  elastic_file:
    class: "logging.FileHandler"
    filename: "c:\\temp\\wiretap_elastic.log"
    formatter: elastic_json
    #level: DEBUG
loggers:
  root:
    #handlers: [ "console", "file", "elastic_file" ]
    #handlers: [ "console_full", "console_file", "elastic_file" ]
    handlers: [ "console_lite", "console_file", "elastic_file" ]
    #handlers: [ "elastic_file" ]
    #handlers: [ "console" ]
    #level: "INFO"
    level: "DEBUG"
    #level: "TRACE"
  PIL:
    level: "WARNING"