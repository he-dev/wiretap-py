version: 1
disable_existing_loggers: false
formatters:
  console_full:
    (): wiretap.util.logging.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      {asctime}.{msecs:03.0f} [{levelname:7s}]
      {indent}{activity[about]}: "{message}", properties: {properties}, trc={trace}, src={source}
  console_lite:
    (): wiretap.util.logging.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      {asctime}.{msecs:03.0f} [{levelname:7s}]
      {properties[content]:>8}:{indent}{activity[about]}[{activity[event]}]: "{message}", properties: {properties}, src={source}
    indent: ":"
    defaults:
      properties:
        content: stranger
  elastic_json:
    (): wiretap.util.logging.JsonFormatter
    encoders:
      - wiretap.util.EncodeDateTime
      - wiretap.util.EncodeUUID
      - wiretap.util.EncodeSet
      - wiretap.util.EncodePath
      - wiretap.util.EncodeToDict
    pipeline:
      - wiretap.util.AddTimestamp
      - wiretap.util.AddMessage
      - wiretap.util.AddActivity
      - wiretap.util.AddProperties
      - wiretap.util.EnsureContent
      - wiretap.util.AddTrace
      - "()": wiretap.util.AddSource
        include_when: [DEBUG, ERROR, CRITICAL]
      - wiretap.util.AddException
      - wiretap.util.RemoveNoneOrEmpty
handlers:
  console_full:
    class: logging.StreamHandler
    formatter: console_full
    #level: INFO
  console_lite:
    class: logging.StreamHandler
    formatter: console_lite
    #level: INFO
  console_file:
    class: "logging.handlers.TimedRotatingFileHandler"
    when: "d"
    interval: 1
    filename: "c:\\temp\\wiretap_console.log"
    formatter: console_full
    #level: TRACE
  elastic_file:
    class: "logging.FileHandler"
    filename: "c:\\temp\\wiretap_elastic.log"
    formatter: elastic_json
    #level: DEBUG
loggers:
  root:
    #handlers: [ "console", "file", "elastic_file" ]
    #handlers: [ "console_full", "console_file", "elastic_file" ]
    handlers: [ "console_lite", "console_file", "elastic_file" ]
    #handlers: [ "elastic_file" ]
    #handlers: [ "console" ]
    #level: "INFO"
    level: "DEBUG"
    #level: "TRACE"
  PIL:
    level: "WARNING"
