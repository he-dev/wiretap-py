version: 1
formatters:
  classic:
    style: "{"
    format: "{asctime}.{msecs:03d} | {module}.{funcName} | {message}"
    datefmt: "%Y-%m-%d %H:%M:%S"
    defaults:
      status: "<status>"
      correlation: "<correlation>"
      extra: "<extra>"
  wiretap:
    (): wiretap.formatters.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      [{asctime}.{msecs:03.0f} {levelname:7s}]
      {scope}: "{message}"
      properties={context} source={source} activity={activity}
  elastic:
    (): wiretap.formatters.JSONFormatter
    encoders:
      - wiretap.json.encoders.ChainPathEncoder
      - wiretap.json.encoders.DateTimeEncoder
      - wiretap.json.encoders.UUIDEncoder
      - wiretap.json.encoders.SetEncoder
      - wiretap.json.encoders.PathEncoder
      - wiretap.json.encoders.LoopStatsEncoder
    properties:
      - wiretap.json.modifiers.AddTimestamp
      - wiretap.json.modifiers.AddMessage
      - wiretap.json.modifiers.AddProperties
      - wiretap.json.modifiers.AddActivity
      - wiretap.json.modifiers.AddSource
      - wiretap.json.modifiers.AddException
      - (): wiretap.json.modifiers.AddEnvironmentVariables
        names:
          - app_id
handlers:
  console:
    class: logging.StreamHandler
    formatter: wiretap
    #level: INFO
  file:
    class: "logging.handlers.TimedRotatingFileHandler"
    when: "d"
    interval: 1
    filename: "c:\\temp\\wiretap.log"
    formatter: wiretap
    #level: TRACE
  elastic_file:
    class: "logging.FileHandler"
    filename: "c:\\temp\\elastic.log"
    formatter: elastic
    #level: DEBUG
  #sqlserver:
  #  class: "wiretap_sqlserver.SqlServerHandler"
  #  #connection_string: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=automation;UID=sa;PWD=;"
  #  insert: null
  #  level: "DEBUG"
  #  formatter: "auto"

loggers:
  root:
    #handlers: [ "console", "file", "elastic_file" ]
    handlers: [ "console", "elastic_file" ]
    # handlers: [ "console" ]
    level: "TRACE"
    #level: "INFO"
  PIL:
    level: "WARNING"