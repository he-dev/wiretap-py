version: 1
formatters:
  console_full:
    (): wiretap.core.logging.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      [{asctime}.{msecs:03.0f} {levelname:7s}{indent}]
      {span_name}: "{message}"
      | ctx={properties}
      | span={span}
      | src={source}
  console_lite:
    (): wiretap.core.logging.TextFormatter
    style: "{"
    datefmt: "%Y-%m-%d %H:%M:%S"
    fmt: >-
      [{asctime}.{msecs:03.0f} {levelname:7s}{indent}]
      {span_name}: "{message}"
      | ctx={properties}
  elastic_json:
    (): wiretap.core.logging.JsonFormatter
    encoders:
      - wiretap.core.logging.DateTimeEncoder
      - wiretap.core.logging.UUIDEncoder
      - wiretap.core.logging.SetEncoder
      - wiretap.core.logging.PathEncoder
      - wiretap.core.logging.ToDictEncoder
    properties:
      - wiretap.core.logging.AddTimestamp
      - wiretap.core.logging.AddMessage
      - wiretap.core.logging.AddProperties
      - wiretap.core.logging.AddSpan
      - wiretap.core.logging.AddSource
      - wiretap.core.logging.AddException
#      - (): wiretap.core.logging.AddEnvironmentVariables
#        names:
#          - app_id
handlers:
  console_full:
    class: logging.StreamHandler
    formatter: console_full
    filters:
      - exclude_span_begin
    #level: INFO
  console_lite:
    class: logging.StreamHandler
    formatter: console_lite
    #level: INFO
  console_file:
    class: "logging.handlers.TimedRotatingFileHandler"
    when: "d"
    interval: 1
    filename: "c:\\temp\\wiretap_console.log"
    formatter: console_full
    #level: TRACE
  elastic_file:
    class: "logging.FileHandler"
    filename: "c:\\temp\\wiretap_elastic.log"
    formatter: elastic_json
    #level: DEBUG
  #sqlserver:
  #  class: "wiretap_sqlserver.SqlServerHandler"
  #  #connection_string: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost,1433;DATABASE=automation;UID=sa;PWD=;"
  #  insert: null
  #  level: "DEBUG"
  #  formatter: "auto"
filters:
  exclude_span_begin:
    (): wiretap.core.logging.ExcludeSpanBegin
loggers:
  root:
    #handlers: [ "console", "file", "elastic_file" ]
    handlers: [ "console_full", "console_file", "elastic_file" ]
    # handlers: [ "console_lite", "elastic_file" ]
    # handlers: [ "console" ]
    #level: "INFO"
    #level: "DEBUG"
    level: "TRACE"
  PIL:
    level: "WARNING"