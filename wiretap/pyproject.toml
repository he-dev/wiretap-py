[build-system]
requires = ["setuptools>=80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiretap"
version = "14.0.0"
requires-python = ">=3.14"
authors = [{ name = "he-dev" }]
description = "This package provides a context-oriented logger."
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities :: Logging :: Telemetry",
]
readme = { file = "README.md", content-type = "text/markdown" }
dependencies = [
    "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
    "types-PyYAML",
    "build",
    "twine",
    "pytest",
    "mypy",
]

[project.urls]
"GitHub" = "https://github.com/he-dev/wiretap-py"



